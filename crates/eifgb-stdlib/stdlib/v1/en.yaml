  sell.no_merchant: "There's nobody here to sell to."
  sell.not_held: "You're not carrying ${the(args.target)}."
  sell.worthless: "${The(args.merchant)} isn't interested in ${the(args.target)}."
  sell.merchant_poor: "${The(args.merchant)} can't afford ${the(args.target)}."
