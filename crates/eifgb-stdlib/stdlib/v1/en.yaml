  fire.burnt_up: "${The(args.target)} burns away to ash."
  fire.burns_out: "The fire on ${the(args.target)} burns out."
  smash.done: "You smash ${the(args.target)} to pieces."
  destroy.spills: "Out of what's left of ${the(args.target)} falls ${args.list}."
  brandish.done: "You brandish ${the(args.target)}."
  brandish.nothing: "Nobody seems impressed."
  npc.afraid: "${The(args.npc)} shrinks back in fear!"
  npc.flees: "${The(args.npc)} flees ${args.direction}!"
  order.too_scared: "${The(args.npc)} is too scared."
  order.not_person: "There's nobody there to give orders to."
  order.ignored: "${The(args.npc)} ignores you."
  order.confused: "${The(args.npc)} looks at you blankly. Try something like \"tell ${the(args.npc)} to stay\", \"to attack\" someone, \"to follow\", \"to go north\" or \"to fetch\" something."
