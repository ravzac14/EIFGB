# Standard library v1, English.
#
# This file is FROZEN once v1 ships. Additions and changes go into v2/,
# so games pinned to v1 keep behaving exactly the same.
#
# Message templates can use the same ${...} syntax as game text, with
# these helpers: the(x), The(x), a(x), A(x). In messages, `args` holds
# the parsed command: args.target, args.tool, args.text, args.direction.

verbs:
  look:
    action: look
    patterns: ["look", "l", "look around"]
  examine:
    action: examine
    patterns:
      - "examine {target}"
      - "x {target}"
      - "look at {target}"
      - "inspect {target}"
      - "describe {target}"
      - "check {target}"
  inventory:
    action: inventory
    patterns: ["inventory", "i", "inv"]
  go:
    action: go
    patterns: ["go {direction}", "walk {direction}", "{direction}"]
  # Verb keys must not clash with event names (start, turn, parse_failed,
  # enter, leave), because handlers use both. Hence `go_through`, not `enter`.
  go_through:
    action: enter
    patterns:
      - "go through {target}"
      - "walk through {target}"
      - "go in {target}"
      - "go into {target}"
      - "pass through {target}"
      - "get in {target}"
      - "get into {target}"
      - "get on {target}"
      - "get onto {target}"
      - "climb in {target}"
      - "climb into {target}"
      - "climb on {target}"
      - "climb onto {target}"
      - "sit on {target}"
      - "sit in {target}"
      - "stand on {target}"
      - "lie on {target}"
      - "lie in {target}"
      - "hide in {target}"
  get_out:
    action: get_out
    patterns:
      - "get out"
      - "get off"
      - "get up"
      - "get out of {target}"
      - "get off {target}"
      - "climb out"
      - "climb off"
      - "climb out of {target}"
      - "climb off {target}"
      - "stand up"
      - "step out"
      - "step off"
  empty:
    action: empty
    patterns:
      - "empty {target}"
      - "empty out {target}"
      - "empty {target} out"
      - "tip out {target}"
      - "empty {target} into {tool}"
      - "empty {target} in {tool}"
      - "empty {target} onto {tool}"
      - "empty {target} on {tool}"
  take:
    action: take
    patterns:
      - "take {target}"
      - "get {target}"
      - "pick up {target}"
      - "pick {target} up"
      - "take {target} from {tool}"
  drop:
    action: drop
    patterns:
      - "drop {target}"
      - "put down {target}"
      - "put {target} down"
      - "discard {target}"
  put_in:
    action: put_in
    patterns:
      - "put {target} in {tool}"
      - "put {target} into {tool}"
      - "put {target} inside {tool}"
      - "insert {target} in {tool}"
      - "insert {target} into {tool}"
  put_on:
    action: put_on
    patterns:
      - "put {target} on {tool}"
      - "put {target} onto {tool}"
      - "place {target} on {tool}"
  open:
    action: open
    patterns: ["open {target}"]
  close:
    action: close
    patterns: ["close {target}", "shut {target}"]
  unlock:
    action: unlock
    patterns: ["unlock {target} with {tool}", "unlock {target}"]
  lock:
    action: lock
    patterns: ["lock {target} with {tool}", "lock {target}"]
  search:
    action: search
    patterns:
      - "search {target}"
      - "look in {target}"
      - "look inside {target}"
      - "look under {target}"
      - "look behind {target}"
      - "feel in {target}"
      - "rummage in {target}"
  talk:
    action: talk
    patterns:
      - "talk to {target}"
      - "talk with {target}"
      - "speak to {target}"
      - "speak with {target}"
      - "chat with {target}"
      - "greet {target}"
  wear:
    action: wear
    patterns: ["wear {target}", "put on {target}", "put {target} on"]
  take_off:
    action: take_off
    patterns: ["take off {target}", "take {target} off", "remove {target}"]
  eat:
    action: eat
    patterns: ["eat {target}", "consume {target}"]
  wait:
    action: wait
    patterns: ["wait", "z"]
  score:
    action: score
    patterns: ["score"]
  undo:
    action: undo
    patterns: ["undo"]
  save:
    action: save
    patterns: ["save"]
  restore:
    action: restore
    patterns: ["restore", "load"]
  restart:
    action: restart
    patterns: ["restart"]
  help:
    action: help
    patterns: ["help", "hint", "hints"]
  # Verbs with no built-in behaviour. They exist so players can try them and
  # authors can hook into them with handlers, revealed_by or categories.
  push:
    patterns: ["push {target}", "press {target}", "shove {target}"]
    default: "Nothing obvious happens."
  pull:
    patterns: ["pull {target}", "tug {target}", "yank {target}"]
    default: "Nothing obvious happens."
  kick:
    patterns: ["kick {target}"]
    default: "Kicking that won't help."
  hit:
    patterns: ["hit {target}", "punch {target}", "strike {target}", "smash {target}", "break {target}", "attack {target}"]
    default: "Violence isn't the answer here."
  move:
    patterns: ["move {target}", "drag {target}", "shift {target}", "slide {target}"]
    default: "Nothing obvious happens."
  lift:
    patterns: ["lift {target}", "raise {target}", "lift up {target}"]
    default: "Nothing obvious happens."
  shake:
    patterns: ["shake {target}"]
    default: "Nothing obvious happens."
  twist:
    patterns: ["turn {target}", "twist {target}", "rotate {target}", "spin {target}"]
    default: "Nothing obvious happens."
  touch:
    patterns: ["touch {target}", "feel {target}", "rub {target}", "pat {target}"]
    default: "You feel nothing unexpected."
  smell:
    patterns: ["smell {target}", "sniff {target}", "smell", "sniff"]
    default: "You smell nothing unexpected."
  listen:
    patterns: ["listen to {target}", "listen"]
    default: "You hear nothing unusual."
    reach: false          # you can hear through glass
  taste:
    patterns: ["taste {target}", "lick {target}"]
    default: "You'd rather not."
  again:
    action: again
    patterns: ["again", "g"]
  quit:
    action: quit
    patterns: ["quit", "q"]

# Action categories for `revealed_by: (physical action) rug`. Authors write
# the name in brackets; case and spaces/underscores don't matter.
categories:
  physical_action: [push, pull, kick, hit, move, lift, shake, twist, touch]
  inspect: [examine, search]
  sense: [smell, listen, taste, touch]

lexicon:
  phrases:
    grab: take
    snatch: take
    nab: take
    collect: take
    acquire: take
    peer at: examine
    study: examine
    observe: examine
    view: examine
    read: examine
    look over: examine
    toss: drop
    throw away: drop
    head: go
    run: go
    travel: go
    proceed: go
    enter: go in
    exit: go out
    leave: go out
    devour: eat
    munch: eat
    don: wear
    doff: take off
    rest: wait
    slam: close
    unbolt: unlock
  directions:
    n: north
    north: north
    s: south
    south: south
    e: east
    east: east
    w: west
    west: west
    ne: northeast
    northeast: northeast
    nw: northwest
    northwest: northwest
    se: southeast
    southeast: southeast
    sw: southwest
    southwest: southwest
    u: up
    up: up
    upstairs: up
    d: down
    down: down
    downstairs: down
    in: in
    inside: in
    out: out
    outside: out
  articles: [the, a, an, some]
  filler: ["please", "try to", "i want to", "i'd like to", "let me", "i will", "i'll"]
  pronouns: [it, them, him, her]
  all_words: [all, everything]
  self_words: [me, myself, self]

messages:
  # the player
  player.name: "yourself"
  # parser
  parser.empty: "Pardon?"
  parser.unknown_verb: "I don't know the verb \"${args.word}\". Things to try here: ${args.suggestions}."
  parser.unknown_word: "I don't know the word \"${args.word}\"."
  parser.not_here: "You can't see any such thing."
  parser.partial: "I only understood you as far as wanting to ${args.verb}."
  parser.ambiguous: "Which do you mean, ${args.options}?"
  parser.need_target: "What do you want to ${args.verb}?"
  parser.need_tool: "What do you want to ${args.verb} ${the(args.target)} ${args.word}?"
  parser.no_pronoun: "I'm not sure what you're referring to."
  parser.no_all: "You can't use \"all\" with that."
  parser.all_none: "There's nothing suitable here."
  # looking
  look.exits: "Exits: ${args.list}."
  look.no_exits: "There's no obvious way out."
  look.you_see: "You can see ${args.list} here."
  examine.default: "You see nothing special about ${the(args.target)}."
  examine.self: "As good-looking as ever."
  examine.contents: "In ${the(args.target)} you can see ${args.list}."
  examine.on_top: "On ${the(args.target)} you can see ${args.list}."
  search.nothing: "You find nothing of interest."
  reveal.found: "You find ${args.list}."
  search.contents: "In ${the(args.target)} you find ${args.list}."
  # inventory
  inventory.empty: "You're empty-handed."
  inventory.list: "You're carrying ${args.list}."
  # movement
  go.no_exit: "You can't go that way."
  go.door_closed: "${The(args.door)} is closed."
  go.blocked: "You can't go that way right now."
  go.opening_first: "(first opening ${the(args.door)})"
  enter.cannot: "That's not something you can get into or go through."
  # automatic state descriptions (settings.describe_state)
  state.open: "It's open."
  state.closed: "It's closed."
  state.locked: "It's locked."
  state.worn: "You're wearing it."
  state.blocked: "It's blocked."
  state.blocked_here: "It's blocked from this side."
  state.here.open: "${The(args.target)} is open."
  state.here.closed: "${The(args.target)} is closed."
  state.here.locked: "${The(args.target)} is locked."
  state.here.blocked: "${The(args.target)} is blocked."
  state.here.blocked_here: "${The(args.target)} is blocked from this side."
  state.tag.open: "open"
  state.tag.closed: "closed"
  state.tag.locked: "locked"
  state.tag.worn: "worn"
  state.tag.blocked: "blocked"
  state.tag.blocked_here: "blocked from this side"
  # an author's own state fields, e.g. `fueled: true` or `channel: 16`
  state.custom.on: "It's ${args.state}."
  state.custom.off: "It isn't ${args.state}."
  state.custom.value: "Its ${args.state} is ${args.value}."
  state.here.custom.on: "${The(args.target)} is ${args.state}."
  # taking and dropping
  take.done: "Taken."
  take.already: "You already have ${the(args.target)}."
  take.fixed: "${The(args.target)} won't budge."
  take.scenery: "That's hardly portable."
  take.person: "${The(args.target)} wouldn't care for that."
  take.self: "You can't take yourself."
  take.full: "You're carrying too much already."
  take.cant_carry: "You can't carry anything."
  take.too_big: "${The(args.target)} is too big to carry."
  take.not_in: "${The(args.target)} isn't in ${the(args.tool)}."
  take.not_on: "${The(args.target)} isn't on ${the(args.tool)}."
  drop.done: "Dropped."
  drop.not_held: "You're not carrying ${the(args.target)}."
  put_in.done: "You put ${the(args.target)} in ${the(args.tool)}."
  put_on.done: "You put ${the(args.target)} on ${the(args.tool)}."
  put.not_held: "You need to be holding ${the(args.target)} first."
  put.not_container: "You can't put anything in ${the(args.tool)}."
  put.not_supporter: "You can't put anything on ${the(args.tool)}."
  put.closed: "${The(args.tool)} is closed."
  put.into_self: "You can't put something inside itself."
  put.full: "There's no more room in ${the(args.tool)}."
  put.too_big: "${The(args.target)} is too big for ${the(args.tool)}."
  # carried containers in lists
  list.containing: "${args.item} (containing ${args.list})"
  list.supporting: "${args.item} (with ${args.list} on it)"
  # emptying
  empty.done: "You tip ${args.list} out of ${the(args.target)}."
  empty.into: "You tip ${args.list} from ${the(args.target)} into ${the(args.tool)}."
  empty.onto: "You tip ${args.list} from ${the(args.target)} onto ${the(args.tool)}."
  empty.nothing: "${The(args.target)} is already empty."
  empty.cannot: "That's not something you can empty."
  empty.closed: "${The(args.target)} is closed."
  # getting in and out of things
  enter.done_in: "You get into ${the(args.target)}."
  enter.done_on: "You get onto ${the(args.target)}."
  enter.already_in: "You're already in ${the(args.target)}."
  enter.already_on: "You're already on ${the(args.target)}."
  enter.held: "You'll need to put ${the(args.target)} down first."
  enter.full: "There's no room for you in ${the(args.target)}."
  get_out.done_in: "You get out of ${the(args.target)}."
  get_out.done_on: "You get off ${the(args.target)}."
  get_out.nothing: "You're not in or on anything."
  get_out.not_there: "You're not in or on ${the(args.target)}."
  go.getting_out_first: "(first getting out of ${the(args.target)})"
  go.getting_off_first: "(first getting off ${the(args.target)})"
  look.title_in: "${args.room} (in ${the(args.target)})"
  look.title_on: "${args.room} (on ${the(args.target)})"
  look.enclosed: "You're shut inside ${the(args.target)}."
  # transparent containers
  reach.closed: "You can't reach ${the(args.target)}: ${the(args.holder)} is closed."
  # doors and containers
  open.done: "You open ${the(args.target)}."
  open.already: "${The(args.target)} is already open."
  open.locked: "${The(args.target)} is locked."
  open.blocked: "${The(args.target)} won't open."
  open.blocked_here: "${The(args.target)} won't open from this side."
  open.cannot: "That's not something you can open."
  close.done: "You close ${the(args.target)}."
  close.already: "${The(args.target)} is already closed."
  close.cannot: "That's not something you can close."
  unlock.done: "You unlock ${the(args.target)} with ${the(args.tool)}."
  unlock.not_locked: "${The(args.target)} isn't locked."
  unlock.wrong_key: "${The(args.tool)} doesn't fit."
  unlock.no_key: "You don't have anything that unlocks it."
  unlock.cannot: "That doesn't have a lock."
  lock.done: "You lock ${the(args.target)} with ${the(args.tool)}."
  lock.already: "${The(args.target)} is already locked."
  lock.close_first: "You'll need to close ${the(args.target)} first."
  lock.no_key: "You don't have anything that locks it."
  lock.cannot: "That doesn't have a lock."
  # people
  talk.no_response: "${The(args.target)} doesn't respond."
  talk.not_person: "You'd get more conversation out of a brick."
  # clothing and food
  wear.done: "You put on ${the(args.target)}."
  wear.already: "You're already wearing ${the(args.target)}."
  wear.cannot: "You can't wear that."
  take_off.done: "You take off ${the(args.target)}."
  take_off.not_worn: "You're not wearing ${the(args.target)}."
  eat.done: "You eat ${the(args.target)}."
  eat.cannot: "That's not edible."
  # meta
  wait.done: "Time passes."
  score.report: "You have scored ${game.score}${if game.max_score} out of a possible ${game.max_score}${end}, in ${game.turn} turns."
  score.gained: "[Your score has gone up by ${args.points}.]"
  undo.done: "[Undone.]"
  undo.none: "There's nothing to undo."
  save.done: "[Saved.]"
  restore.done: "[Restored.]"
  restore.none: "There's no saved game."
  restore.failed: "That save couldn't be restored: ${args.reason}"
  help.text: "Type short commands like LOOK, EXAMINE the DOOR (or X DOOR), TAKE the KEY, OPEN the BOX, GO NORTH (or just N) and TALK TO someone. INVENTORY (or I) lists what you carry, UNDO takes back a move, and SAVE and RESTORE keep your place."
  ending.win: "*** You have won ***"
  ending.loss: "*** You have lost ***"
  ending.neutral: "*** The End ***"
  ending.options: "Type UNDO to take back your last move, RESTORE to load a saved game, or RESTART."
  action.nothing: "Nothing happens."
  choice.invalid: "Please choose one of the numbered options."
