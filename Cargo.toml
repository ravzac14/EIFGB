[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
eifgb-ir = { path = "crates/eifgb-ir" }
eifgb-stdlib = { path = "crates/eifgb-stdlib" }
eifgb-compiler = { path = "crates/eifgb-compiler" }
eifgb-engine = { path = "crates/eifgb-engine" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
