# Action categories for `revealed_by: (physical action) rug`. Authors write
# the name in brackets; case and spaces/underscores don't matter.
categories:
  physical_action: [push, pull, kick, hit, move, lift, shake, twist, touch]
  inspect: [examine, search]
  sense: [smell, listen, taste, touch]

