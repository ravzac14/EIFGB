# Standard library v1, English.
#
# This file is FROZEN once v1 ships. Additions and changes go into v2/,
# so games pinned to v1 keep behaving exactly the same.
#
# Message templates can use the same ${...} syntax as game text, with
# these helpers: the(x), The(x), a(x), A(x). In messages, `args` holds
# the parsed command: args.target, args.tool, args.text, args.direction.

verbs:
  look:
    action: look
    patterns: ["look", "l", "look around"]
  examine:
    action: examine
    patterns:
      - "examine {target}"
      - "x {target}"
      - "look at {target}"
      - "inspect {target}"
      - "describe {target}"
      - "check {target}"
  inventory:
    action: inventory
    patterns: ["inventory", "i", "inv"]
  go:
    action: go
    patterns: ["go {direction}", "walk {direction}", "{direction}"]
  # Verb keys must not clash with event names (start, turn, parse_failed,
  # enter, leave), because handlers use both. Hence `go_through`, not `enter`.
  go_through:
    action: enter
    patterns:
      - "go through {target}"
      - "walk through {target}"
      - "go in {target}"
      - "go into {target}"
      - "pass through {target}"
      - "get in {target}"
      - "get into {target}"
      - "get on {target}"
      - "get onto {target}"
      - "climb in {target}"
      - "climb into {target}"
      - "climb on {target}"
      - "climb onto {target}"
      - "sit on {target}"
      - "sit in {target}"
      - "stand on {target}"
      - "lie on {target}"
      - "lie in {target}"
      - "hide in {target}"
  get_out:
    action: get_out
    patterns:
      - "get out"
      - "get off"
      - "get up"
      - "get out of {target}"
      - "get off {target}"
      - "climb out"
      - "climb off"
      - "climb out of {target}"
      - "climb off {target}"
      - "stand up"
      - "step out"
      - "step off"
  empty:
    action: empty
    patterns:
      - "empty {target}"
      - "empty out {target}"
      - "empty {target} out"
      - "tip out {target}"
      - "empty {target} into {tool}"
      - "empty {target} in {tool}"
      - "empty {target} onto {tool}"
      - "empty {target} on {tool}"
  take:
    action: take
    patterns:
      - "take {target}"
      - "get {target}"
      - "pick up {target}"
      - "pick {target} up"
      - "take {target} from {tool}"
  drop:
    action: drop
    patterns:
      - "drop {target}"
      - "put down {target}"
      - "put {target} down"
      - "discard {target}"
  put_in:
    action: put_in
    patterns:
      - "put {target} in {tool}"
      - "put {target} into {tool}"
      - "put {target} inside {tool}"
      - "insert {target} in {tool}"
      - "insert {target} into {tool}"
  put_on:
    action: put_on
    patterns:
      - "put {target} on {tool}"
      - "put {target} onto {tool}"
      - "place {target} on {tool}"
  open:
    action: open
    patterns: ["open {target}"]
  close:
    action: close
    patterns: ["close {target}", "shut {target}"]
  unlock:
    action: unlock
    patterns: ["unlock {target} with {tool}", "unlock {target}"]
  lock:
    action: lock
    patterns: ["lock {target} with {tool}", "lock {target}"]
  search:
    action: search
    patterns:
      - "search {target}"
      - "look in {target}"
      - "look inside {target}"
      - "look under {target}"
      - "look behind {target}"
      - "feel in {target}"
      - "rummage in {target}"
  talk:
    action: talk
    patterns:
      - "talk to {target}"
      - "talk with {target}"
      - "speak to {target}"
      - "speak with {target}"
      - "chat with {target}"
      - "greet {target}"
  wear:
    action: wear
    patterns: ["wear {target}", "put on {target}", "put {target} on"]
  take_off:
    action: take_off
    patterns: ["take off {target}", "take {target} off", "remove {target}"]
  eat:
    action: eat
    patterns: ["eat {target}", "consume {target}"]
  wait:
    action: wait
    patterns: ["wait", "z"]
  score:
    action: score
    patterns: ["score"]
  undo:
    action: undo
    patterns: ["undo"]
  save:
    action: save
    patterns: ["save"]
  restore:
    action: restore
    patterns: ["restore", "load"]
  restart:
    action: restart
    patterns: ["restart"]
  help:
    action: help
    patterns: ["help", "hint", "hints"]
  # Verbs with no built-in behaviour. They exist so players can try them and
  # authors can hook into them with handlers, revealed_by or categories.
  push:
    patterns: ["push {target}", "press {target}", "shove {target}"]
    default: "Nothing obvious happens."
  pull:
    patterns: ["pull {target}", "tug {target}", "yank {target}"]
    default: "Nothing obvious happens."
  kick:
    patterns: ["kick {target}"]
    default: "Kicking that won't help."
  hit:
    # Fights anything with health; anything else gets attack.pointless.
    action: attack
    patterns:
      - "hit {target}"
      - "hit {target} with {tool}"
      - "punch {target}"
      - "strike {target}"
      - "strike {target} with {tool}"
      - "smash {target}"
      - "smash {target} with {tool}"
      - "break {target}"
      - "attack {target}"
      - "attack {target} with {tool}"
      - "kill {target}"
      - "kill {target} with {tool}"
      - "fight {target}"
      - "fight {target} with {tool}"
      - "stab {target} with {tool}"
      - "slay {target}"
      - "slay {target} with {tool}"
  buy:
    action: buy
    patterns: ["buy {target}", "buy {target} from {tool}", "purchase {target}"]
  sell:
    action: sell
    patterns: ["sell {target}", "sell {target} to {tool}"]
  wares:
    action: wares
    patterns: ["wares", "list wares", "browse", "shop", "trade", "trade with {target}", "browse {target}"]
  health:
    action: health
    patterns: ["health", "diagnose", "hp", "status"]
  move:
    patterns: ["move {target}", "drag {target}", "shift {target}", "slide {target}"]
    default: "Nothing obvious happens."
  lift:
    patterns: ["lift {target}", "raise {target}", "lift up {target}"]
    default: "Nothing obvious happens."
  shake:
    patterns: ["shake {target}"]
    default: "Nothing obvious happens."
  twist:
    patterns: ["turn {target}", "twist {target}", "rotate {target}", "spin {target}"]
    default: "Nothing obvious happens."
  touch:
    patterns: ["touch {target}", "feel {target}", "rub {target}", "pat {target}"]
    default: "You feel nothing unexpected."
  smell:
    patterns: ["smell {target}", "sniff {target}", "smell", "sniff"]
    default: "You smell nothing unexpected."
  listen:
    patterns: ["listen to {target}", "listen"]
    default: "You hear nothing unusual."
    reach: false          # you can hear through glass
  taste:
    patterns: ["taste {target}", "lick {target}"]
    default: "You'd rather not."
  again:
    action: again
    patterns: ["again", "g"]
  quit:
    action: quit
    patterns: ["quit", "q"]

# Action categories for `revealed_by: (physical action) rug`. Authors write
# the name in brackets; case and spaces/underscores don't matter.
categories:
  physical_action: [push, pull, kick, hit, move, lift, shake, twist, touch]
  inspect: [examine, search]
  sense: [smell, listen, taste, touch]

lexicon:
  phrases:
    grab: take
    snatch: take
    nab: take
    collect: take
    acquire: take
    peer at: examine
    study: examine
    observe: examine
    view: examine
    read: examine
    look over: examine
    toss: drop
    throw away: drop
    head: go
    run: go
    travel: go
    proceed: go
    enter: go in
    exit: go out
    leave: go out
    devour: eat
    munch: eat
    don: wear
    doff: take off
    rest: wait
    slam: close
    unbolt: unlock
  directions:
    n: north
    north: north
    s: south
    south: south
    e: east
    east: east
    w: west
    west: west
    ne: northeast
    northeast: northeast
    nw: northwest
    northwest: northwest
    se: southeast
    southeast: southeast
    sw: southwest
    southwest: southwest
    u: up
    up: up
    upstairs: up
    d: down
    down: down
    downstairs: down
    in: in
    inside: in
    out: out
    outside: out
  articles: [the, a, an, some]
  filler: ["please", "try to", "i want to", "i'd like to", "let me", "i will", "i'll"]
  pronouns: [it, them, him, her]
  all_words: [all, everything]
  self_words: [me, myself, self]
  # Refer to any dead character: "x corpse", "search the body".
  corpse_words: [corpse, body, remains, carcass, bones]
  # Never treated as referring to something, even when a description uses them.
  stopwords: [
    and, or, but, nor, not, yet, the, some, any, each, every, all, both, either, neither,
    of, to, in, on, at, by, for, from, with, without, into, onto, out, off, over, under,
    about, above, below, behind, beside, between, beyond, through, across, along, around,
    against, among, near, nearby, toward, towards, upon, within, inside, outside, past, until,
    is, are, was, were, be, been, being, am, has, have, had, does, did, can, could, would,
    should, will, shall, may, might, must, its, it's, this, that, these, those, there, here,
    there's, here's, you, your, you're, yours, yourself, our, ours, his, hers, their, theirs,
    they, them, what, which, who, whom, whose, when, where, why, how, than, then, too, very,
    just, only, also, still, even, ever, never, once, again, almost, already, much, many, more,
    most, less, least, few, such, own, same, other, another, one, two, three, nothing, anything,
    everything, can't, won't, don't, isn't, aren't, wasn't, doesn't, didn't, now, away, back, ago,
    yes, like, into, so, as, if, else, end,
  ]

messages:
  # the player
  player.name: "yourself"
  # parser
  parser.empty: "Pardon?"
  parser.unknown_verb: "I don't know the verb \"${args.word}\". Things to try here: ${args.suggestions}."
  parser.unknown_word: "I don't know the word \"${args.word}\"."
  parser.not_here: "You can't see any such thing."
  parser.scenery: "That's just part of the scenery."
  # characters acting
  npc.leaves: "${The(args.npc)} goes ${args.direction}."
  npc.arrives: "${The(args.npc)} arrives."
  npc.attacks_you: "${The(args.npc)} attacks you${if args.weapon} with ${the(args.weapon)}${end}."
  npc.attacks: "${The(args.npc)} attacks ${the(args.target)}."
  npc.defeated: "${The(args.target)} is defeated."
  npc.losing_patience_you: "${The(args.target)} is losing patience with you."
  # A faction's attitude to the player souring, and running out.
  faction.wary: "The ${args.faction} are growing wary of you."
  faction.turns: "The ${args.faction} turn against you."
  faction.sees_through: "The ${args.faction} see through your disguise!"
  npc.losing_patience: "${The(args.target)} is losing patience with ${the(args.npc)}."
