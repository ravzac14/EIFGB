  npc.eats: "${The(args.npc)} devours what's left of ${the(args.target)}."
  npc.fight_nearby: "You hear snarls and the clash of a fight somewhere ${args.direction}."
  npc.eating_nearby: "You hear tearing and crunching somewhere ${args.direction}."
  npc.feeds: "${The(args.npc)} tears into ${the(args.target)}."
  npc.finishes: "${The(args.npc)} finishes off ${the(args.target)}."
  npc.searches: "${The(args.npc)} searches all around, but finds nothing."
  attack.dead: "${The(args.target)} is already dead."
