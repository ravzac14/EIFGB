  order.wont_attack_you: "${The(args.npc)} won't attack you."
  order.pacifist: "${The(args.npc)} won't fight."
  chatter.overheard: "${The(args.npc)} says to ${the(args.listener)}, \"${args.line}\""
  chatter.nearby: "You hear a voice ${args.from}: \"${args.line}\""
  eavesdrop.door: "You press your ear to ${the(args.door)} and listen."
  eavesdrop.direction: "You listen carefully for anything ${args.from}."
  eavesdrop.all: "You keep still and listen."
  eavesdrop.nothing: "You hear nothing."
  eavesdrop.no_way: "There's nothing to listen to that way."
  from.north: "from the north"
  from.south: "from the south"
  from.east: "from the east"
  from.west: "from the west"
  from.northeast: "from the northeast"
