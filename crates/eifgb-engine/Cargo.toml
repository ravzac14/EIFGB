[package]
name = "eifgb-engine"
description = "Runtime: world model, parser and script host. Targets native and wasm32."
version.workspace = true
edition.workspace = true
publish.workspace = true

# This crate must stay free of filesystem, thread and clock access so that
# it compiles to wasm32-unknown-unknown. All I/O goes through the host.

[dependencies]
eifgb-ir.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
eifgb-compiler.workspace = true
