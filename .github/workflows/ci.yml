# The Rust tests (including every example played to a win) and clippy,
# on pushes and pull requests.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check the example games
        run: |
          cargo build -p eifgb-cli
          for g in spec/examples/*/game.yaml; do ./target/debug/eifgb check "$g"; done
