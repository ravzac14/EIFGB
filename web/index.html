<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIFGB Games</title>
<meta name="description" content="Play interactive fiction made with EIFGB, or load your own game.">
<link rel="stylesheet" href="./src/style.css">
<link rel="stylesheet" href="./src/home.css">
</head>
<body>
<header class="wrap">
  <h1>EIFGB</h1>
  <p class="dim">Interactive fiction you can play right here. Type what you want to do; the story answers.</p>
</header>
<main class="wrap">
  <section>
    <h2>Games to play</h2>
    <ul id="examples" class="games"><li class="dim">Loading…</li></ul>
  </section>
  <section>
    <h2>Play your own game</h2>
    <div id="drop" class="drop" tabindex="0">
      <p>Drop a game folder, a <code>.zip</code>, or a <code>game.yaml</code> here.</p>
      <p class="row">
        <button id="pick-folder" class="primary" type="button">Choose a folder</button>
        <button id="pick-files" type="button">Choose files or a zip</button>
      </p>
      <input id="folder" type="file" webkitdirectory hidden>
      <input id="files" type="file" multiple accept=".yaml,.yml,.lua,.zip" hidden>
      <p id="drop-msg" class="msg" role="status"></p>
    </div>
    <ul id="local" class="games"></ul>
  </section>
</main>
<footer class="wrap dim ui">
  <p><button id="settings-open" class="link" type="button">Text and colours</button></p>
</footer>
<dialog id="settings"></dialog>
<script type="module" src="./src/home.ts"></script>
</body>
</html>
