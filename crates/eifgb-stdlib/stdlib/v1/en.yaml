# Standard library v1, English.
#
# This file is FROZEN once v1 ships. Additions and changes go into v2/,
# so games pinned to v1 keep behaving exactly the same.
#
# Message templates can use the same ${...} syntax as game text, with
# these helpers: the(x), The(x), a(x), A(x). In messages, `args` holds
# the parsed command: args.target, args.tool, args.text, args.direction.

verbs:
  look:
    action: look
    patterns: ["look", "l", "look around"]
  examine:
    action: examine
    patterns:
      - "examine {target}"
      - "x {target}"
      - "look at {target}"
      - "inspect {target}"
      - "describe {target}"
      - "check {target}"
  inventory:
    action: inventory
    patterns: ["inventory", "i", "inv"]
  go:
    action: go
    patterns: ["go {direction}", "walk {direction}", "climb {direction}", "{direction}"]
  # Verb keys must not clash with event names (start, turn, parse_failed,
  # enter, leave), because handlers use both. Hence `go_through`, not `enter`.
  go_through:
    action: enter
    patterns:
      - "go through {target}"
      - "walk through {target}"
      - "go in {target}"
      - "go into {target}"
      - "pass through {target}"
      - "get in {target}"
      - "get into {target}"
      - "get on {target}"
      - "get onto {target}"
      - "climb in {target}"
      - "climb into {target}"
      - "climb on {target}"
      - "climb onto {target}"
      - "climb up on {target}"
      - "climb up onto {target}"
      - "climb {target}"
      - "sit on {target}"
      - "sit in {target}"
      - "stand on {target}"
      - "step on {target}"
      - "step onto {target}"
      - "lie on {target}"
      - "lie in {target}"
      - "hide in {target}"
  get_out:
    action: get_out
    patterns:
      - "get out"
      - "get off"
      - "get up"
      - "get out of {target}"
      - "get off {target}"
      - "climb out"
      - "climb off"
      - "climb out of {target}"
      - "climb off {target}"
      - "stand up"
      - "step out"
      - "step off"
  empty:
    action: empty
    patterns:
      - "empty {target}"
      - "empty out {target}"
      - "empty {target} out"
      - "tip out {target}"
      - "empty {target} into {tool}"
      - "empty {target} in {tool}"
      - "empty {target} onto {tool}"
      - "empty {target} on {tool}"
  take:
    action: take
    patterns:
      - "take {target}"
      - "get {target}"
      - "pick up {target}"
      - "pick {target} up"
      - "take {target} from {tool}"
  drop:
    action: drop
    patterns:
      - "drop {target}"
      - "put down {target}"
      - "put {target} down"
      - "discard {target}"
  put_in:
    action: put_in
    patterns:
      - "put {target} in {tool}"
      - "put {target} into {tool}"
      - "hide {target} in {tool}"
      - "stuff {target} in {tool}"
      - "put {target} inside {tool}"
      - "insert {target} in {tool}"
      - "insert {target} into {tool}"
  put_on:
    action: put_on
    patterns:
      - "put {target} on {tool}"
      - "put {target} onto {tool}"
      - "place {target} on {tool}"
  open:
    action: open
    patterns: ["open {target}"]
  close:
    action: close
    patterns: ["close {target}", "shut {target}"]
  unlock:
    action: unlock
    patterns: ["unlock {target} with {tool}", "unlock {target}"]
  lock:
    action: lock
    patterns: ["lock {target} with {tool}", "lock {target}"]
  search:
    action: search
    patterns:
      - "search {target}"
      - "look in {target}"
      - "look inside {target}"
      - "look under {target}"
      - "look behind {target}"
      - "feel in {target}"
      - "rummage in {target}"
  talk:
    action: talk
    patterns:
      - "talk to {target}"
      - "talk with {target}"
      - "speak to {target}"
      - "speak with {target}"
      - "chat with {target}"
      - "greet {target}"
      - "ask {target}"
      - "tell {target}"
      - "ask {target} about {text}"
      - "tell {target} about {text}"
      - "ask {target} for {text}"
      - "question {target}"
      - "talk"
      - "chat"
      - "ask about {text}"
      - "tell about {text}"
  wear:
    action: wear
    patterns: ["wear {target}", "put on {target}", "put {target} on"]
  take_off:
    action: take_off
    patterns: ["take off {target}", "take {target} off", "remove {target}"]
  eat:
    action: eat
    patterns: ["eat {target}", "consume {target}"]
  wait:
    action: wait
    patterns: ["wait", "z"]
  score:
    action: score
    patterns: ["score"]
  undo:
    action: undo
    patterns: ["undo"]
  save:
    action: save
    patterns: ["save"]
  restore:
    action: restore
    patterns: ["restore", "load"]
  restart:
    action: restart
    patterns: ["restart"]
  help:
    action: help
    patterns: ["help"]
  hint:
    action: hint
    patterns: ["hint", "hints", "clue", "give me a hint"]
  journal:
    action: journal
    patterns: ["journal", "goals", "objectives", "tasks", "quests"]
  time:
    action: time
    patterns: ["time", "what time is it", "check the time", "check time", "tell the time"]
  push_to:
    action: push_to
    patterns:
      - "push {target} {direction}"
      - "shove {target} {direction}"
      - "pull {target} {direction}"
      - "drag {target} {direction}"
      - "move {target} {direction}"
      - "roll {target} {direction}"
      - "slide {target} {direction}"
      - "heave {target} {direction}"
  # Verbs with no built-in behaviour. They exist so players can try them and
  # authors can hook into them with handlers, revealed_by or categories.
  push:
    patterns: ["push {target}", "press {target}", "shove {target}"]
    default: "Nothing obvious happens."
  pull:
    patterns: ["pull {target}", "tug {target}", "yank {target}"]
    default: "Nothing obvious happens."
  kick:
    patterns: ["kick {target}"]
    default: "Kicking that won't help."
  hit:
    # Fights anything with health; anything else gets attack.pointless.
    action: attack
    patterns:
      - "hit {target}"
      - "hit {target} with {tool}"
      - "punch {target}"
      - "strike {target}"
      - "strike {target} with {tool}"
      - "smash {target}"
      - "smash {target} with {tool}"
      - "break {target}"
      - "attack {target}"
      - "attack {target} with {tool}"
      - "kill {target}"
      - "kill {target} with {tool}"
      - "fight {target}"
      - "fight {target} with {tool}"
      - "stab {target} with {tool}"
      - "slay {target}"
      - "slay {target} with {tool}"
  buy:
    action: buy
    patterns: ["buy {target}", "buy {target} from {tool}", "purchase {target}"]
  sell:
    action: sell
    patterns:
      - "sell {target}"
      - "sell {target} to {tool}"
      - "sell {target} for {text}"
      - "sell {target} to {tool} for {text}"
      - "ask {text} for {target}"
      - "demand {text} for {target}"
  give:
    action: give
    patterns:
      - "give {target} to {tool}"
      - "hand {target} to {tool}"
      - "offer {target} to {tool}"
      - "feed {target} to {tool}"
  bribe:
    action: bribe
    patterns:
      - "give {text} coins to {target}"
      - "give {text} coin to {target}"
      - "give {text} money to {target}"
      - "pay {text} to {target}"
      - "bribe {target} with {text}"
      - "bribe {target}"
  throw:
    action: throw
    patterns:
      - "throw {target} at {tool}"
      - "hurl {target} at {tool}"
      - "toss {target} at {tool}"
      - "chuck {target} at {tool}"
      - "throw {target} {direction}"
      - "toss {target} {direction}"
      - "hurl {target} {direction}"
      - "throw {target}"
      - "toss {target}"
      - "hurl {target}"
  rename:
    action: rename
    reach: false
    # The "as"/"to" forms come first, so they aren't read as part of the name.
    patterns:
      - "name {target} as {text}"
      - "rename {target} as {text}"
      - "rename {target} to {text}"
      - "call {target} {text}"
      - "name {target} {text}"
      - "rename {target} {text}"
      - "christen {target} {text}"
      - "call {target}"
      - "name {target}"
      - "rename {target}"
  tracks:
    action: tracks
    reach: false
    patterns:
      - "examine tracks"
      - "x tracks"
      - "look at tracks"
      - "look for tracks"
      - "search for tracks"
      - "check for tracks"
      - "study tracks"
      - "read tracks"
      - "find tracks"
      - "tracks"
      - "examine footprints"
      - "x footprints"
      - "look at footprints"
      - "look for footprints"
      - "examine prints"
      - "x prints"
      - "look at the ground"
  follow_tracks:
    action: follow_tracks
    reach: false
    patterns: ["follow {text}", "track {text}", "trail {text}"]
  set_trap:
    action: set_trap
    patterns: ["set {target}", "arm {target}", "lay {target}", "set up {target}", "prime {target}"]
  disarm_trap:
    action: disarm_trap
    patterns: ["disarm {target}", "defuse {target}", "unset {target}"]
  sound:
    action: sound
    patterns: ["blow {target}", "sound {target}", "play {target}", "ring {target}", "toot {target}"]
  mimic:
    action: mimic
    reach: false
    patterns:
      - "imitate {text}"
      - "mimic {text}"
      - "impersonate {text}"
      - "call like {text}"
      - "howl"
      - "bark"
      - "growl"
      - "roar"
      - "hoot"
      - "screech"
      - "squawk"
      - "caw"
      - "grunt"
      - "bleat"
  burn:
    action: burn
    patterns:
      - "burn {target}"
      - "burn {target} with {tool}"
      - "set {target} alight"
      - "set {target} alight with {tool}"
      - "set {target} on fire"
      - "set fire to {target}"
      - "set light to {target}"
      - "torch {target}"
  douse:
    action: douse
    patterns:
      - "pour {tool} on {target}"
      - "pour {tool} over {target}"
      - "tip {tool} over {target}"
      - "douse {target} with {tool}"
      - "extinguish {target} with {tool}"
      - "put out {target} with {tool}"
      - "smother {target} with {tool}"
  brandish:
    action: brandish
    patterns:
      - "brandish {target}"
      - "brandish {target} at {tool}"
      - "wave {target}"
      - "wave {target} at {tool}"
      - "thrust {target} at {tool}"
      - "show {target} to {tool}"
      - "swing {target} at {tool}"
  order:
    action: order
    reach: false
    patterns:
      - "tell {target} to {text}"
      - "order {target} to {text}"
      - "ask {target} to {text}"
      - "command {target} to {text}"
      - "instruct {target} to {text}"
  eavesdrop:
    action: eavesdrop
    reach: false
    patterns:
      - "eavesdrop"
      - "eavesdrop {direction}"
      - "listen {direction}"
      - "listen at {target}"
      - "listen through {target}"
      - "press ear to {target}"
      - "put ear to {target}"
      - "listen in"
  steal:
    action: steal
    patterns:
      - "steal {target} from {tool}"
      - "pickpocket {target} from {tool}"
      - "pinch {target} from {tool}"
      - "lift {target} from {tool}"
      - "steal {target}"
      - "pickpocket {target}"
      - "rob {target}"
  light:
    action: light
    patterns:
      - "light {target}"
      - "light {target} with {tool}"
      - "ignite {target}"
      - "turn on {target}"
      - "turn {target} on"
      - "switch on {target}"
      - "switch {target} on"
  extinguish:
    action: extinguish
    patterns:
      - "extinguish {target}"
      - "put out {target}"
      - "blow out {target}"
      - "snuff {target}"
      - "douse {target}"
      - "turn off {target}"
      - "turn {target} off"
      - "switch off {target}"
      - "switch {target} off"
  peek:
    action: peek
    reach: false
    patterns:
      - "peek {direction}"
      - "peer {direction}"
      - "look {direction}"
      - "peek through {target}"
      - "peer through {target}"
      - "look through {target}"
      - "peek into {target}"
      - "peek through the keyhole of {target}"
      - "look through the keyhole of {target}"
  sneak:
    action: sneak
    patterns: ["sneak {direction}", "creep {direction}", "tiptoe {direction}", "sneak to {direction}", "sneak to the {direction}"]
  bury:
    action: bury
    patterns: ["bury {target}", "dig a grave for {target}"]
  accept:
    action: accept
    patterns: ["accept", "accept offer", "accept the offer", "accept deal", "accept the deal", "deal", "agree", "shake on it"]
  trade:
    action: trade
    patterns:
      - "trade {target} for {tool}"
      - "swap {target} for {tool}"
      - "exchange {target} for {tool}"
      - "barter {target} for {tool}"
  wares:
    action: wares
    patterns: ["wares", "list wares", "browse", "shop", "trade", "trade with {target}", "browse {target}"]
  apologize:
    action: apologize
    reach: false
    patterns:
      - "apologize to {target}"
      - "apologise to {target}"
      - "say sorry to {target}"
      - "make peace with {target}"
      - "beg {target} for forgiveness"
      - "ask {target} for forgiveness"
      - "calm {target}"
      - "calm down {target}"
      - "calm {target} down"
  offer:
    action: offer
    reach: false
    patterns:
      - "offer {text} for {target}"
      - "bid {text} for {target}"
      - "haggle for {target}"
      - "haggle over {target}"
      - "bargain for {target}"
  shout:
    action: shout
    patterns: ["shout", "shout {text}", "yell", "yell {text}", "scream", "holler", "make noise", "make a noise", "call out"]
  health:
    action: health
    patterns: ["health", "diagnose", "hp", "status"]
  move:
    patterns: ["move {target}", "drag {target}", "shift {target}", "slide {target}"]
    default: "Nothing obvious happens."
  lift:
    patterns: ["lift {target}", "raise {target}", "lift up {target}"]
    default: "Nothing obvious happens."
  shake:
    patterns: ["shake {target}"]
    default: "Nothing obvious happens."
  twist:
    patterns: ["turn {target}", "twist {target}", "rotate {target}", "spin {target}"]
    default: "Nothing obvious happens."
  touch:
    patterns: ["touch {target}", "feel {target}", "rub {target}", "pat {target}"]
    default: "You feel nothing unexpected."
  smell:
    patterns: ["smell {target}", "sniff {target}", "smell", "sniff"]
    default: "You smell nothing unexpected."
  listen:
    patterns: ["listen to {target}", "listen"]
    default: "You hear nothing unusual."
    reach: false          # you can hear through glass
  taste:
    patterns: ["taste {target}", "lick {target}"]
    default: "You'd rather not."
  again:
    action: again
    patterns: ["again", "g"]
  quit:
    action: quit
    patterns: ["quit", "q"]

# Action categories for `revealed_by: (physical action) rug`. Authors write
# the name in brackets; case and spaces/underscores don't matter.
categories:
  physical_action: [push, pull, kick, hit, move, lift, shake, twist, touch]
  inspect: [examine, search]
  sense: [smell, listen, taste, touch]

lexicon:
  phrases:
    grab: take
    snatch: take
    nab: take
    collect: take
    acquire: take
    peer at: examine
    study: examine
    observe: examine
    view: examine
    read: examine
    look over: examine
    throw away: drop
    head: go
    run: go
    travel: go
    proceed: go
    enter: go in
    exit: go out
    leave: go out
    devour: eat
    munch: eat
    don: wear
    doff: take off
    rest: wait
    slam: close
    unbolt: unlock
  directions:
    n: north
    north: north
    s: south
    south: south
    e: east
    east: east
    w: west
    west: west
    ne: northeast
    northeast: northeast
    nw: northwest
    northwest: northwest
    se: southeast
    southeast: southeast
    sw: southwest
    southwest: southwest
    u: up
    up: up
    upstairs: up
    d: down
    down: down
    downstairs: down
    in: in
    inside: in
    out: out
    outside: out
  articles: [the, a, an, some]
  filler: ["please", "try to", "i want to", "i'd like to", "let me", "i will", "i'll"]
  pronouns: [it, them, him, her]
  all_words: [all, everything]
  self_words: [me, myself, self]
  # Refer to any dead character: "x corpse", "search the body".
  corpse_words: [corpse, body, remains, carcass, bones]
  # Never treated as referring to something, even when a description uses them.
  stopwords: [
    and, or, but, nor, not, yet, the, some, any, each, every, all, both, either, neither,
    of, to, in, on, at, by, for, from, with, without, into, onto, out, off, over, under,
    about, above, below, behind, beside, between, beyond, through, across, along, around,
    against, among, near, nearby, toward, towards, upon, within, inside, outside, past, until,
    is, are, was, were, be, been, being, am, has, have, had, does, did, can, could, would,
    should, will, shall, may, might, must, its, it's, this, that, these, those, there, here,
    there's, here's, you, your, you're, yours, yourself, our, ours, his, hers, their, theirs,
    they, them, what, which, who, whom, whose, when, where, why, how, than, then, too, very,
    just, only, also, still, even, ever, never, once, again, almost, already, much, many, more,
    most, less, least, few, such, own, same, other, another, one, two, three, nothing, anything,
    everything, can't, won't, don't, isn't, aren't, wasn't, doesn't, didn't, now, away, back, ago,
    yes, like, into, so, as, if, else, end,
  ]

messages:
  # the player
  player.name: "yourself"
  # parser
  parser.empty: "Pardon?"
  parser.unknown_verb: "I don't know the verb \"${args.word}\". Things to try here: ${args.suggestions}."
  parser.unknown_word: "I don't know the word \"${args.word}\"."
  parser.not_here: "You can't see any such thing."
  parser.scenery: "That's just part of the scenery."
  parser.dark: "It's too dark to see."
  look.dark_title: "Darkness"
  look.dark: "It's pitch dark. You can't see a thing."
  # Light through an open way between a dark room and a lit one. The lists
  # are made of the phrases below: "the north and above".
  look.light_from: "Light spills in from ${args.list}."
  look.dark_beyond: "It's dark ${args.list}."
  look.from: "the ${args.direction}"
  look.from_up: "above"
  look.from_down: "below"
  look.from_in: "inside"
  look.from_out: "outside"
  look.toward: "to the ${args.direction}"
  look.toward_up: "above"
  look.toward_down: "below"
  look.toward_in: "inside"
  look.toward_out: "outside"
  trap.set: "You set ${the(args.target)}."
  trap.not_trap: "You can't set ${the(args.target)}."
  trap.already: "${The(args.target)} is already set."
  trap.disarm: "You disarm ${the(args.target)}."
  trap.not_set: "${The(args.target)} isn't set."
  trap.take_armed: "You carefully disarm ${the(args.target)} and pick it up."
  trap.catches: "${The(args.npc)} is caught in ${the(args.trap)}!"
  trap.catches_you: "You're caught in ${the(args.trap)}!"
  trap.struggles: "${The(args.npc)} struggles in ${the(args.trap)}."
  trap.breaks_free: "${The(args.npc)} breaks free of ${the(args.trap)}."
  trap.stuck: "You're caught fast in ${the(args.trap)}."
  trap.you_free: "You work yourself free."
  sound.done: "You ${args.verb} ${the(args.target)}."
  sound.cant: "You can't get a sound out of ${the(args.target)}."
  mimic.call: "You let out a convincing ${args.sound}."
  mimic.impression: "You do your best impression of ${args.what}."
  mimic.strange: "You make a strange noise."
  burn.done: "You touch ${the(args.tool)} to ${the(args.target)}, and it catches fire."
  burn.cant: "${The(args.target)} won't burn."
  burn.already: "${The(args.target)} is already burning."
  burn.no_flame: "You've nothing burning to light it with."
  fire.spreads: "The fire spreads to ${the(args.target)}."
  fire.spreads_away: "The flames leap ${args.direction}, into the next room."
  fire.spreads_in: "Flames leap in and catch ${the(args.target)}!"
  fire.smoke: "Smoke drifts in ${args.from}."
  fire.scorches_you: "The flames scorch you!"
  fire.scorches: "${The(args.npc)} is scorched by the flames."
  fire.too_big: "${The(args.target)} is burning too fiercely to put out with your bare hands."
  douse.done: "You throw ${the(args.tool)} over ${the(args.target)}, and the fire hisses out."
